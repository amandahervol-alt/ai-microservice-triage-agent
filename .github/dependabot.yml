version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/ad-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    ignore:
      # Stay on Spring Boot 3.x. Spring Boot 4 needs Gradle 8.14+ and test API migrations.
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/ai-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - pip
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - github-actions
